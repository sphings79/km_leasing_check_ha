name: Feature request
description: Suggest a calculation, entity or card element
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would you use it for?
      description: A concrete example from your own contract helps most.
