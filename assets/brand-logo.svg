  <line x1="80" y1="86" x2="54" y2="52" stroke="#ffffff" stroke-width="6"
        stroke-linecap="round"/>
  <circle cx="80" cy="86" r="9" fill="#6366f1"/>
  <circle cx="80" cy="86" r="3.5" fill="#ffffff"/>
  <text x="80" y="124" fill="#e6edf3" font-size="19" font-weight="700"
        text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">km</text>

  <text x="170" y="97" fill="url(#word)" font-size="50" font-weight="700"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Leasing KM</text>
</svg>
