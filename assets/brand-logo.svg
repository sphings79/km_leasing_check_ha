<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 160" width="486" height="160"
     role="img" aria-label="Leasing KM logo: a speedometer dial next to the wordmark Leasing KM">
  <defs>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#41BDF5"/>
      <stop offset="1" stop-color="#7C7CF5"/>
    </linearGradient>
  </defs>

  <circle cx="80" cy="80" r="64" fill="#1b2136"/>
  <path d="M 36 98 A 48 48 0 1 1 124 98" fill="none" stroke="url(#arc)"
